<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 | Sign in</title>
    <script src="assets/js/theme.js?v=profile1"></script>
    <link rel="stylesheet" href="assets/css/app.css?v=green1">
    <link rel="stylesheet" href="assets/css/themes.css?v=scene3">
    <link rel="stylesheet" href="assets/css/design.css?v=green1">
    <link rel="stylesheet" href="assets/css/feedback.css?v=green1">
    <link rel="stylesheet" href="assets/css/auth-scene.css?v=scene3">
    <script src="assets/js/feedback.js?v=green1" defer></script>
    <script src="assets/js/shell.js?v=green1" defer></script>
    <script src="assets/js/auth.js?v=green1" defer></script>
    <script src="assets/js/account-pages.js?v=auth2" defer></script>
    <script src="assets/js/auth-scene.js?v=scene3" defer></script>
</head>
<body class="auth-page auth-scene">
    <img class="scene-image" src="assets/images/city-evening.png" alt="" fetchpriority="high">
    <header class="scene-header">
        <a class="app-brand" href="login.html" aria-label="SmartCity360 sign in"><span class="brand-symbol">S</span><span class="brand-word">smartcity</span><span class="brand-number">360</span></a>
    </header>
    <main id="main-content" class="scene-main">
        <section class="scene-card" aria-labelledby="auth-title">
            <div class="scene-intro"><h1 id="auth-title">Sign in</h1><p id="auth-description">Access your city workspace.</p></div>
            <div class="scene-tabs" aria-label="Account options">
                <button id="show-login" type="button" aria-pressed="true" aria-controls="login-panel">Sign in</button>
                <button id="show-register" type="button" aria-pressed="false" aria-controls="register-panel">Create account</button>
            </div>
            <p id="message" class="scene-message" role="status" aria-live="polite"></p>
            <section id="login-panel" aria-label="Sign in form">
                <form id="login-form" class="scene-form">
                    <div><label for="login-email">Email address</label><input id="login-email" type="email" required maxlength="254" autocomplete="username" class="field" placeholder="you@example.com"></div>
                    <div><label for="login-password">Password</label><div class="password-field"><input id="login-password" type="password" required maxlength="128" autocomplete="current-password" class="field" placeholder="Enter your password"><button class="password-reveal" type="button" data-password="login-password" aria-label="Show password" aria-pressed="false" hidden></button></div></div>
                    <button class="button scene-submit" type="submit">Sign in</button>
                </form>
                <p class="scene-help">One sign-in for residents and city teams.</p>
            </section>
            <section id="register-panel" aria-label="Resident registration form" hidden>
                <form id="register-form" class="scene-form">
                    <div><label for="register-name">Full name</label><input id="register-name" required maxlength="100" autocomplete="name" class="field" placeholder="Your full name"></div>
                    <div><label for="register-email">Email address</label><input id="register-email" type="email" required maxlength="254" autocomplete="username" class="field" placeholder="you@example.com"></div>
                    <div><label for="register-password">Password <span class="label-hint">(8-128 characters)</span></label><div class="password-field"><input id="register-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" class="field"><button class="password-reveal" type="button" data-password="register-password" aria-label="Show new password" aria-pressed="false" hidden></button></div></div>
                    <div><label for="register-confirm">Confirm password</label><div class="password-field"><input id="register-confirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password" class="field"><button class="password-reveal" type="button" data-password="register-confirm" aria-label="Show password confirmation" aria-pressed="false" hidden></button></div></div>
                    <button class="button scene-submit" type="submit">Create account</button>
                </form>
                <p class="scene-help">Resident registration. Staff accounts are provided by an administrator.</p>
            </section>
        </section>
    </main>
</body>
</html>
