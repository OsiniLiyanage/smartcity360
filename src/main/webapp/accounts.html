<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><script src="assets/js/theme.js?v=scene3"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartCity360 | Manage users</title><link rel="stylesheet" href="assets/css/app.css?v=green1"><link rel="stylesheet" href="assets/css/themes.css?v=scene3"><link rel="stylesheet" href="assets/css/design.css?v=green1"><link rel="stylesheet" href="assets/css/feedback.css?v=green1"><script src="assets/js/feedback.js?v=green1" defer></script><script src="assets/js/shell.js?v=green1" defer></script><script src="assets/js/auth.js?v=green1" defer></script><script src="assets/js/account-pages.js?v=green1" defer></script></head><body class="workspace">

<main id="main-content" tabindex="-1" class="mx-auto max-w-7xl px-5 py-8"><h1 class="text-3xl font-bold">Manage user access</h1><p class="mt-3 text-sm text-slate-600">Create accounts, assign a city to staff and disable access when needed. Every change is recorded.</p><p id="message" role="status" aria-live="polite" class="my-5 min-h-6 text-sm text-teal-800"></p><div class="grid items-start gap-6 lg:grid-cols-2"><div class="space-y-6">
<section class="panel"><h2 class="mb-4 text-lg font-semibold">Create an account</h2><form id="create-form" class="space-y-4"><div><label for="create-name" class="label">Display name</label><input id="create-name" required maxlength="100" class="field"></div><div><label for="create-email" class="label">Email address</label><input id="create-email" type="email" required maxlength="254" class="field"></div><div><label for="create-role" class="label">Role</label><select id="create-role" class="field"><option value="LOCAL_STAFF">Local staff</option><option value="SUPERVISOR">Supervisor</option><option value="CITY_MANAGER">City manager</option><option value="RESIDENT">Resident</option><option value="SYSTEM_ADMIN">System admin</option></select></div><div><label for="create-city" class="label">Assigned city (staff only)</label><select id="create-city" required class="field"></select></div><button type="submit" class="button">Create account</button></form></section>
<section id="issued" hidden class="panel"><h2 class="font-semibold">Temporary sign-in details</h2><p id="issued-email" class="mt-3 break-words text-sm"></p><p id="temporary-password" class="my-3 break-all rounded-lg bg-slate-50 p-3 font-mono text-sm"></p><p class="text-sm leading-6 text-slate-600">Share this password privately. It is shown only once and must be changed before the user can work.</p><button id="hide-password" type="button" class="secondary mt-4">Hide password</button></section>
<section id="edit-panel" hidden class="panel"><h2 id="edit-name" class="mb-4 text-lg font-semibold"></h2><form id="edit-form" class="space-y-4"><div><label for="edit-role" class="label">Role</label><select id="edit-role" class="field"><option value="LOCAL_STAFF">Local staff</option><option value="SUPERVISOR">Supervisor</option><option value="CITY_MANAGER">City manager</option><option value="RESIDENT">Resident</option><option value="SYSTEM_ADMIN">System admin</option></select></div><div><label for="edit-city" class="label">Assigned city (staff only)</label><select id="edit-city" required class="field"></select></div><label class="flex items-center gap-3 text-sm"><input id="edit-enabled" type="checkbox"> Account is active</label><button type="submit" class="button">Save access changes</button></form></section></div>
<section class="panel"><div class="flex flex-wrap items-center justify-between gap-3"><h2 class="text-lg font-semibold">Accounts</h2><button id="refresh-users" type="button" class="secondary">Refresh accounts</button></div><p id="page-info" class="my-4 text-xs text-slate-500"></p><div id="users" class="space-y-3"></div><div class="mt-4 flex justify-between"><button id="previous" type="button" class="secondary">Previous</button><button id="next" type="button" class="secondary">Next</button></div></section></div>
<section class="panel mt-6"><h2 class="text-lg font-semibold">Account activity</h2><button id="load-events" type="button" class="secondary my-4">Load recent account activity</button><ul id="events" class="divide-y divide-slate-100"></ul></section></main>
</body></html>
