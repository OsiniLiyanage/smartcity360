<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartCity360 | My account</title><link rel="stylesheet" href="assets/css/app.css?v=20261108-accounts2"><script src="assets/js/auth.js?v=20261108-accounts2" defer></script><script src="assets/js/account-pages.js?v=20261108-accounts2" defer></script></head><body>
<header class="border-b border-slate-200 bg-white"><div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5"><a href="home.html" class="text-xl font-bold text-slate-900">SmartCity<span class="text-teal-700">360</span></a><span class="badge">Municipal operations</span></div></header>
<nav aria-label="Main navigation" class="mx-auto flex max-w-7xl flex-wrap gap-5 border-b border-slate-200 px-5 py-3 text-sm"><a href="./">City zones</a><a href="complaints.html">Complaints</a><a href="meters.html">Energy meters</a><a href="streetlights.html">Streetlights</a><a href="policies.html">City policies</a></nav><main class="mx-auto max-w-3xl px-5 py-8"><h1 class="text-3xl font-bold">My account</h1><p id="account-details" class="mt-3 text-sm text-slate-500"></p><p id="message" role="status" aria-live="polite" class="my-5 min-h-6 text-sm text-teal-800"></p>
<section class="panel"><h2 class="mb-4 text-lg font-semibold">Profile</h2><form id="profile-form" class="space-y-4"><div><label for="display-name" class="label">Display name</label><input id="display-name" required maxlength="100" autocomplete="name" class="field"></div><button type="submit" class="button">Save profile</button></form></section>
<section class="panel mt-6"><h2 class="text-lg font-semibold">Change password</h2><p class="my-3 text-sm leading-6 text-slate-500">Changing your password signs out your existing sessions. Sign in again with the new password.</p><form id="password-form" class="space-y-4"><div><label for="current-password" class="label">Current password</label><input id="current-password" type="password" required maxlength="128" autocomplete="current-password" class="field"></div><div><label for="new-password" class="label">New password (12 to 128 characters)</label><input id="new-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="field"></div><div><label for="confirm-password" class="label">Confirm new password</label><input id="confirm-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="field"></div><button type="submit" class="button">Change password and sign out</button></form></section></main>
</body></html>
