<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><script src="assets/js/theme.js?v=green1"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartCity360 | Profile</title><link rel="stylesheet" href="assets/css/app.css?v=green1"><link rel="stylesheet" href="assets/css/themes.css?v=green1"><link rel="stylesheet" href="assets/css/design.css?v=green1"><link rel="stylesheet" href="assets/css/feedback.css?v=green1"><script src="assets/js/feedback.js?v=green1" defer></script><script src="assets/js/shell.js?v=green1" defer></script><script src="assets/js/auth.js?v=green1" defer></script><script src="assets/js/account-pages.js?v=green1" defer></script></head><body class="workspace">

<main id="main-content" tabindex="-1" class="mx-auto max-w-3xl px-5 py-8"><div class="profile-heading"><p class="eyebrow">ACCOUNT / PERSONAL DETAILS</p><h1 class="text-3xl font-bold">Your profile</h1><p id="account-details" class="mt-3 text-sm text-slate-500"></p><p id="message" role="status" aria-live="polite" class="my-5 min-h-6 text-sm text-teal-800"></p>
</div><div class="profile-layout"><section class="panel"><h2 class="mb-4 text-lg font-semibold">Personal details</h2><form id="profile-form" class="space-y-4"><div><label for="display-name" class="label">Display name</label><input id="display-name" required maxlength="100" autocomplete="name" class="field"></div><button type="submit" class="button">Save profile</button></form></section>
<section class="panel mt-6"><h2 class="text-lg font-semibold">Change password</h2><p class="my-3 text-sm leading-6 text-slate-500">Changing your password signs out your existing sessions. Sign in again with the new password.</p><form id="password-form" class="space-y-4"><div><label for="current-password" class="label">Current password</label><input id="current-password" type="password" required maxlength="128" autocomplete="current-password" class="field"></div><div><label for="new-password" class="label">New password (12 to 128 characters)</label><input id="new-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="field"></div><div><label for="confirm-password" class="label">Confirm new password</label><input id="confirm-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="field"></div><button type="submit" class="button">Change password and sign out</button></form></section></div></main>
</body></html>
